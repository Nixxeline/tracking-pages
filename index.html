<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Phoenixx Nest Logistics - Tracking</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>

  <style>
    body {
      margin: 0;
      font-family: 'Segoe UI', sans-serif;
      background: linear-gradient(135deg, #1a2a6c, #fdbb2d);
      color: #333;
    }

    header {
      padding: 20px;
      text-align: center;
      color: white;
      font-size: 22px;
      font-weight: bold;
    }

    .lang-toggle {
      position: absolute;
      top: 20px;
      right: 20px;
    }

    .lang-toggle button {
      margin-left: 5px;
      padding: 6px 10px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
    }

    .container {
      max-width: 500px;
      margin: 60px auto;
      background: white;
      padding: 30px;
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.2);
      text-align: center;
    }

    input {
      width: 70%;
      padding: 12px;
      border-radius: 8px;
      border: 1px solid #ddd;
    }

    button.track {
      padding: 12px;
      margin-left: 10px;
      border: none;
      border-radius: 8px;
      background: #e63946;
      color: white;
      cursor: pointer;
    }

    .card {
      margin-top: 30px;
      padding: 20px;
      border-radius: 12px;
      background: #f8f9fa;
      text-align: left;
    }

    .progress {
      height: 10px;
      background: #ddd;
      border-radius: 10px;
      overflow: hidden;
      margin: 15px 0;
    }

    .progress-bar {
      height: 100%;
      width: 0%;
      background: #1a2a6c;
      transition: width 0.5s;
    }

    .error {
      color: red;
      margin-top: 15px;
    }
  </style>
</head>

<body>

<div class="lang-toggle">
  <button onclick="setLang('fr')">FR</button>
  <button onclick="setLang('en')">EN</button>
</div>

<header id="title">
  Phoenixx Nest Logistics — Suivi de colis
</header>

<div class="container">
  <h2 id="subtitle">Suivre votre colis</h2>

  <input type="text" id="trackingInput" placeholder="PNL-XXXX">
  <button class="track" onclick="track()" id="trackBtn">Suivre</button>

  <div id="error" class="error"></div>

  <div id="result" class="card" style="display:none;">
    <h3 id="statusText"></h3>

    <div class="progress">
      <div id="progressBar" class="progress-bar"></div>
    </div>

    <p><strong id="paymentLabel">Paiement:</strong> <span id="payment"></span></p>
    <p><strong id="weightLabel">Poids:</strong> <span id="weight"></span></p>
  </div>
</div>

<script>
  const supabase = supabase.createClient(
    "https://xxkazzqocdyywsiajlmw.supabase.co",
    "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inh4a2F6enFvY2R5eXdzaWFqbG13Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzYxMjAwMDcsImV4cCI6MjA5MTY5NjAwN30.WcafL-H4EZPYLpgKkwnlSLcDCZfsScdk2k5f9_oy7uQ"
  );

  let lang = "fr";

  function setLang(selected) {
    lang = selected;

    document.getElementById("title").innerText =
      lang === "fr" ? "Phoenixx Nest Logistics — Suivi de colis" : "Phoenixx Nest Logistics — Package Tracking";

    document.getElementById("subtitle").innerText =
      lang === "fr" ? "Suivre votre colis" : "Track your package";

    document.getElementById("trackBtn").innerText =
      lang === "fr" ? "Suivre" : "Track";

    document.getElementById("paymentLabel").innerText =
      lang === "fr" ? "Paiement:" : "Payment:";

    document.getElementById("weightLabel").innerText =
      lang === "fr" ? "Poids:" : "Weight:";
  }

  function getProgress(status) {
    switch(status) {
      case "Reçu": return 20;
      case "En traitement": return 40;
      case "Expédié": return 60;
      case "Arrivé": return 80;
      case "Livré": return 100;
      default: return 10;
    }
  }

  async function track(id = null) {
    const trackingId = id || document.getElementById("trackingInput").value;
    const errorDiv = document.getElementById("error");
    const resultDiv = document.getElementById("result");

    errorDiv.innerText = "";
    resultDiv.style.display = "none";

    const { data, error } = await supabase
      .from("shipments")
      .select("*")
      .eq("tracking_id", trackingId)
      .single();

    if (error || !data) {
      errorDiv.innerText = lang === "fr"
        ? "Numéro introuvable"
        : "Tracking number not found";
      return;
    }

    document.getElementById("statusText").innerText =
      (lang === "fr" ? "Statut: " : "Status: ") + data.status;

    document.getElementById("payment").innerText = data.payment_status;
    document.getElementById("weight").innerText = data.weight + " kg";

    document.getElementById("progressBar").style.width =
      getProgress(data.status) + "%";

    resultDiv.style.display = "block";
  }

  // 🔥 AUTO LOAD FROM LINK
  const params = new URLSearchParams(window.location.search);
  const trackingFromURL = params.get("id");

  if (trackingFromURL) {
    document.getElementById("trackingInput").value = trackingFromURL;
    track(trackingFromURL);
  }
</script>

</body>
</html>
